# 빌드 캐시 — 입력이 그대로면 태스크 결과를 재사용한다. CI에서는 gradle/actions/setup-gradle이
# ~/.gradle 캐시를 브랜치 간에 공유하므로, 코드가 안 바뀐 빌드는 test까지 FROM-CACHE로 건너뛴다.
org.gradle.caching=true

# 단일 모듈이라 병렬 실행의 이득은 크지 않지만, 독립 태스크(compileJava·processResources 등)는 겹쳐 돈다.
org.gradle.parallel=true

# 기본 힙으로는 Modulith 구조 검증과 대형 테스트 컴파일에서 GC에 시간을 쓴다.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
