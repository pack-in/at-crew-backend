name = "at-crew-media-worker"
main = "src/index.js"
compatibility_date = "2026-08-05"

# 계정이 여러 개면 wrangler가 매번 선택 프롬프트를 띄운다. 레포가 공개라 계정 ID를 파일에 적는 대신
# 환경변수로 넘긴다 — at-crew-storage 버킷이 있는 팀 공용 계정 ID를 셸에 export 해두면 된다:
#   export CLOUDFLARE_ACCOUNT_ID=<팀 공용 계정 ID>   (값은 Cloudflare 대시보드 우측 하단)

# R2 버킷 바인딩 — 서버(application.yml의 cloudflare.r2.bucket)와 반드시 같은 버킷 이름이어야 한다.
# artwork·recruit(구인글/팀원모집글/구직글) 이미지가 전부 이 한 버킷을 공유한다 — media 모듈은
# ownerId를 불투명 문자열로만 다루고 소유 타입별로 버킷을 나누지 않는다.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "at-crew-storage"

# 원본·썸네일 변환은 Images 바인딩이 아니라 fetch(url, {cf:{image}})로 한다. 그 경로는 바인딩과 달리
# 원본 바이트를 Worker 메모리로 가져오지 않아 입력 한계가 20MB가 아니라 100MB다.
#
# 공유 미리보기(OG) 합성만 바인딩을 쓴다. 입력이 이미 만든 썸네일(AVIF, 수십 KB)이라 20MB 한계와 무관하고,
# cf.image는 AVIF 입력을 거부한다(ERROR 9520, 2026-10-15 실측). docs/design/og-image-design.md D3.
[images]
binding = "IMAGES"

# 시크릿(CALLBACK_SECRET, INTERNAL_SECRET, SERVER_CALLBACK_URL)은 wrangler.toml에 적지 않는다.
# `wrangler secret put <이름>`으로 등록한다 (README 참고).
