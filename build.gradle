plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.atcrew'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', '2.0.6')
}

dependencies {
	// 검색 모듈(docs/design/search-module-design.md) — artwork 원본 데이터는 그대로 두고 조회 전용 색인만 추가
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	// MariaDB 전환(docs/design/mariadb-migration-design.md) — P5에서 Mongo 의존성 완전 제거 완료
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	// Spring Boot 4부터 Flyway 자동설정이 spring-boot-autoconfigure에서 분리됐다 —
	// flyway-core만으로는 자동 실행되지 않으므로 이 모듈을 명시적으로 추가해야 한다.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 관측(docs/design/observability-design.md §3) — /actuator/prometheus 노출용 레지스트리.
	// 애플리케이션 코드는 Micrometer 코어 API만 쓰므로 런타임 의존으로 둔다.
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'com.google.firebase:firebase-admin:9.4.3'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	// Modulith 이벤트 레지스트리(docs/design/mariadb-migration-design.md §3.8) — event_publication을 MariaDB에 저장.
	// 스키마는 Modulith 자동 생성을 끄고 Flyway(V13)가 단독 관리한다.
	implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	// 결제/구독(plans/260813-stripe-billing) — Stripe 직결. Checkout·Customer Portal·웹훅 서명 검증에 사용한다.
	implementation 'com.stripe:stripe-java:33.3.0'
	implementation platform('software.amazon.awssdk:bom:2.31.5')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:url-connection-client'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.modulith:spring-modulith-docs'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-elasticsearch'
	testImplementation 'org.testcontainers:testcontainers-mariadb'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

tasks.named('test') {
	// stripe-sandbox 태그는 실제 Stripe sandbox API를 호출하므로 기본 테스트에서 제외한다.
	// 실행하려면 ./gradlew stripeSandboxTest (STRIPE_SECRET_KEY·STRIPE_PRICE_* 환경변수 필요).
	useJUnitPlatform {
		excludeTags 'stripe-sandbox'
	}
	// 글로벌 시간대 전략(docs/design/global-timezone-strategy.md §3.1) — 테스트 JVM은 AtCrewBackendApplication.main()을
	// 거치지 않아 TimeZone.setDefault(UTC)가 적용되지 않으므로 개발 환경의 로컬 시간대에 결과가 좌우되지 않도록 별도 고정.
	jvmArgs '-Duser.timezone=UTC'
}

// Stripe sandbox 실호출 테스트(plans/260813-stripe-billing PA-14). 키가 없으면 각 테스트가 스스로 skip한다.
tasks.register('stripeSandboxTest', Test) {
	description = 'Stripe sandbox(test mode) 실호출 테스트 — test clock으로 갱신·결제 실패를 재현한다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'stripe-sandbox'
	}
	jvmArgs '-Duser.timezone=UTC'
}

tasks.named('bootRun') {
	// 글로벌 시간대 전략(docs/design/global-timezone-strategy.md §3.1) — 이중 안전장치.
	// AtCrewBackendApplication.main()의 TimeZone.setDefault(UTC)보다 앞서 JVM 부팅 시점부터 UTC를 강제한다.
	jvmArgs '-Duser.timezone=UTC'
}
