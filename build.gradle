plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.atcrew'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', '2.0.6')
}

dependencies {
	// 검색 모듈(docs/design/search-module-design.md) — artwork 원본 데이터는 그대로 두고 조회 전용 색인만 추가
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	// MariaDB 전환(docs/design/mariadb-migration-design.md) — P5에서 Mongo 의존성 완전 제거 완료
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	// Spring Boot 4부터 Flyway 자동설정이 spring-boot-autoconfigure에서 분리됐다 —
	// flyway-core만으로는 자동 실행되지 않으므로 이 모듈을 명시적으로 추가해야 한다.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 관측(docs/design/observability-design.md §3) — /actuator/prometheus 노출용 레지스트리.
	// 애플리케이션 코드는 Micrometer 코어 API만 쓰므로 런타임 의존으로 둔다.
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	// 에러 추적(docs/design/observability-design.md §5) — Logback 어펜더로 ERROR만 이슈화한다.
	// 5xx는 GlobalExceptionHandler가 이미 log.error로 분류하고 있어 그 분류를 그대로 재사용한다.
	// Sentry는 스타터를 쓰지 않는다 — sentry-spring-boot-starter-jakarta 8.16.0의 오토컨피그가
	// Spring Boot 3에만 있던 RestClientCustomizer를 참조해 Boot 4에서 컨텍스트 초기화가 실패한다(이슈 #62).
	// SDK 초기화와 logback 어펜더 연결은 SentryConfig가 직접 한다.
	implementation 'io.sentry:sentry-logback:8.16.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Google 로그인(plans/260911-google-login-firebase-removal) — Firebase Admin SDK를 걷어내고
	// Google 공식 GoogleIdTokenVerifier로 ID Token 서명·iss·aud를 직접 검증한다.
	implementation 'com.google.api-client:google-api-client:2.8.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	// Modulith 이벤트 레지스트리(docs/design/mariadb-migration-design.md §3.8) — event_publication을 MariaDB에 저장.
	// 스키마는 Modulith 자동 생성을 끄고 Flyway(V13)가 단독 관리한다.
	implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	// 결제/구독(plans/260813-stripe-billing) — Stripe 직결. Checkout·Customer Portal·웹훅 서명 검증에 사용한다.
	implementation 'com.stripe:stripe-java:33.3.0'
	implementation platform('software.amazon.awssdk:bom:2.31.5')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:url-connection-client'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.modulith:spring-modulith-docs'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-elasticsearch'
	testImplementation 'org.testcontainers:testcontainers-mariadb'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

tasks.named('test') {
	// stripe-sandbox 태그는 실제 Stripe sandbox API를 호출하므로 기본 테스트에서 제외한다.
	// 실행하려면 ./gradlew stripeSandboxTest (STRIPE_SECRET_KEY·STRIPE_PRICE_* 환경변수 필요).
	useJUnitPlatform {
		excludeTags 'stripe-sandbox'
	}
	// 실패 원인을 워크플로 로그만으로 판별할 수 있게 한다. 기본 출력은 단언 메시지를 잘라내
	// "AssertionError at X.java:1834"까지만 남기는데, 폴링 대기가 실패했을 때 정작 필요한
	// "기대값 vs 실제값"이 그 메시지 안에 있다(2026-08-28 CI 실패 분석에서 막힌 지점).
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
		showStackTraces = true
		showCauses = true
	}
	// 글로벌 시간대 전략(docs/design/global-timezone-strategy.md §3.1) — 테스트 JVM은 AtCrewBackendApplication.main()을
	// 거치지 않아 TimeZone.setDefault(UTC)가 적용되지 않으므로 개발 환경의 로컬 시간대에 결과가 좌우되지 않도록 별도 고정.
	jvmArgs '-Duser.timezone=UTC'

	// 테스트 JVM 힙. 기본값 512MB는 이 레포에 맞지 않는다 — @ApplicationModuleTest 12개와
	// @SpringBootTest 8개가 서로 다른 Spring 컨텍스트를 만들고, 캐시된 컨텍스트마다
	// EntityManagerFactory·Hibernate 메타데이터·Modulith 이벤트 레지스트리를 물고 있어
	// 십수 개가 동시에 살아 있다. 512MB로는 GC에 시간을 다 쓰다가 폴링 대기가 타임아웃한다
	// (2026-09-11 배포 CI: 정상 8~9분인 스위트가 26분 30초 만에 35개 실패, 전부 컨텍스트 로딩 실패).
	maxHeapSize = '2g'

	// 다이어그램 일치 검사는 아래 diagramTest가 따로 돌린다. 이 태스크에 문서 입력을 걸면 다이어그램만
	// 바꿔도 전체 스위트(약 8분)가 캐시를 잃는다.
	filter {
		excludeTestsMatching 'com.atcrew.DiagramConsistencyTests'
	}
}

// 다이어그램이 코드와 어긋나지 않았는지 검사한다(DiagramConsistencyTests). check에 걸려 있어 ./gradlew build
// (CI 필수 체크)에서 함께 돈다. 따로 돌리려면 ./gradlew diagramTest.
//
// 이 테스트는 컴파일 산출물이 아닌 파일(다이어그램, archify lock, 앵커가 가리키는 소스·워크플로)을 직접
// 읽는다. 입력으로 선언하지 않으면 그 파일만 바꿨을 때 UP-TO-DATE로 건너뛰어 검사가 돌지 않은 채
// 통과한다(org.gradle.caching=true). 앵커 경로는 손으로 옮겨 적지 않고 *.anchors.json에서 읽는다 —
// 새 경로를 가리키는 앵커를 추가해도 입력 선언이 저절로 따라온다. 파싱은 이 태스크를 설정할 때만 한다
// (tasks.register는 지연 설정이라 bootRun 등 다른 태스크에는 영향이 없다).
tasks.register('diagramTest', Test) {
	description = '다이어그램 일치 검사 — modules.mmd↔Modulith 의존, archify SVG↔IR 해시, 코드 앵커'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.atcrew.DiagramConsistencyTests'
	}
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
	inputs.dir('docs/assets').withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.file('scripts/diagrams/archify.lock.json').withPathSensitivity(PathSensitivity.RELATIVE)
	fileTree('docs/assets') { include '*.anchors.json' }.files
			.collectMany { new groovy.json.JsonSlurper().parse(it).anchors*.path }
			.unique()
			// 없는 경로는 입력에서 뺀다 — 넣으면 Gradle 검증 오류가 먼저 나서 테스트의 "경로가 없다" 메시지에 닿지 못한다.
			.findAll { file(it).exists() }
			.each { p ->
				if (file(p).isDirectory()) {
					inputs.dir(p).withPathSensitivity(PathSensitivity.RELATIVE)
				} else {
					inputs.file(p).withPathSensitivity(PathSensitivity.RELATIVE)
				}
			}
}

tasks.named('check') {
	dependsOn 'diagramTest'
}

// Stripe sandbox 실호출 테스트(plans/260813-stripe-billing PA-14). 키가 없으면 각 테스트가 스스로 skip한다.
tasks.register('stripeSandboxTest', Test) {
	description = 'Stripe sandbox(test mode) 실호출 테스트 — test clock으로 갱신·결제 실패를 재현한다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'stripe-sandbox'
	}
	jvmArgs '-Duser.timezone=UTC'
}

tasks.named('bootRun') {
	// 글로벌 시간대 전략(docs/design/global-timezone-strategy.md §3.1) — 이중 안전장치.
	// AtCrewBackendApplication.main()의 TimeZone.setDefault(UTC)보다 앞서 JVM 부팅 시점부터 UTC를 강제한다.
	jvmArgs '-Duser.timezone=UTC'
}
