# EC2 #2 전용 — MariaDB 반동기(semi-sync) Replica.
# docs/design/infra-security-hardening-design.md D6/D7, plans/260901-infra-upgrade/ 참고.
#
# 전제 조건: 이슈 #76(ES → EC2 #1 통합)이 완료되어 EC2 #2가 실제로 비어 있어야 한다. 아직이면
# 이 파일을 배포하지 않는다 — ES와 리소스가 경합한다.
#
# 최초 시딩·복제 연결은 이 compose로 컨테이너를 띄운 뒤 `deploy/replica-setup.sh`로 1회 수행한다
# (PLAN-HUMAN PH-08). 이 파일 자체는 빈 MariaDB 인스턴스를 반동기 슬레이브로 띄우기만 한다.
services:
  mariadb-replica:
    image: mariadb:11.4
    restart: always
    environment:
      # Primary와 같은 비밀번호를 처음부터 쓴다(EC2 #2에도 같은 값의 .env를 배치) — 빈 비밀번호로
      # 띄웠다가 나중에 바꾸는 방식은 그 사이 창에서 누구나 root로 붙을 수 있어 쓰지 않는다.
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: UTC
    command: >
      --server-id=2
      --log-bin=mariadb-bin
      --log-slave-updates
      --binlog-format=ROW
      --plugin-load-add=semisync_slave.so
      --rpl-semi-sync-slave-enabled=1
      --read-only=1
    volumes:
      - mariadb_replica_data:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20
    # 같은 Private Subnet 안에서만 3306을 받는다 — deploy/terraform/security-groups.tf의
    # at-crew-db-replica-sg가 네트워크 레벨에서 한 번 더 막는다.
    ports:
      - "3306:3306"

volumes:
  mariadb_replica_data:
