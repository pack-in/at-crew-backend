# EC2 #1(앱 서버)에 설치. /etc/nginx/conf.d/api.at-crew.com.conf로 복사 후
# nginx -t && systemctl reload nginx.
#
# 주의: Amazon Linux 2023의 기본 /etc/nginx/nginx.conf에도 `listen 80 default_server;` 서버 블록이
# 들어 있다. 아래 default_server 블록과 충돌해 nginx가 기동하지 않으므로, 기본 conf의 그 블록을
# 먼저 주석 처리할 것("duplicate default server for 0.0.0.0:80"으로 실패한다).
#
# Cloudflare DNS에서 api.at-crew.com A레코드를 이 EC2 탄력적 IP로 연결하고 프록시(오렌지 클라우드) 켤 것.
# SSL/TLS 모드는 Cloudflare 대시보드에서 "Flexible" — 클라이언트↔Cloudflare 구간만 HTTPS이고
# Cloudflare↔이 서버 구간은 평문 HTTP라 origin에 인증서가 필요 없다. origin 구간까지 암호화하려면
# Cloudflare Origin CA 인증서를 발급받아 "Full (strict)"으로 전환하고 443 서버 블록을 추가한다.
#
# ── 이 파일의 접근 제어가 왜 필요한가 ──────────────────────────────────────────────
# origin IP가 알려지면(레포 공개·과거 DNS 이력·인증서 투명성 로그 등 경로는 여러 개다) Host 헤더만
# 맞춰 IP로 직접 붙어 Cloudflare의 WAF·레이트리밋·봇 차단을 통째로 건너뛸 수 있다. Flexible 모드라
# 그 구간은 평문이기까지 하다. 그래서 origin이 스스로 "Cloudflare를 거친 요청만" 받아야 한다.
#
# Cloudflare 대역은 바뀔 수 있다 — 원본은 https://www.cloudflare.com/ips/ 이고,
# 갱신은 `curl -s https://www.cloudflare.com/ips-v4` / `-v6` 결과로 아래 두 목록을 함께 교체한다.

# ── Cloudflare 엣지 대역 ──────────────────────────────────────────────────────
# set_real_ip_from: 이 대역에서 온 연결에 한해 CF-Connecting-IP를 $remote_addr로 승격한다.
# 대역 밖에서 직접 들어온 연결에는 적용되지 않으므로 헤더 위조로 $remote_addr을 바꿀 수 없다.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 접근 허용 판정은 승격된 $remote_addr이 아니라 승격 전 원본 연결 주소($realip_remote_addr)로 해야 한다.
# allow/deny·기본 geo는 승격 후 주소를 보기 때문에 여기선 쓸 수 없다.
geo $realip_remote_addr $from_cloudflare {
    default            0;
    127.0.0.1/32       1;   # 서버 자신(헬스체크·운영 스크립트)
    173.245.48.0/20    1;
    103.21.244.0/22    1;
    103.22.200.0/22    1;
    103.31.4.0/22      1;
    141.101.64.0/18    1;
    108.162.192.0/18   1;
    190.93.240.0/20    1;
    188.114.96.0/20    1;
    197.234.240.0/22   1;
    198.41.128.0/17    1;
    162.158.0.0/15     1;
    104.16.0.0/13      1;
    104.24.0.0/14      1;
    172.64.0.0/13      1;
    131.0.72.0/22      1;
    2400:cb00::/32     1;
    2606:4700::/32     1;
    2803:f800::/32     1;
    2405:b500::/32     1;
    2405:8100::/32     1;
    2a06:98c0::/29     1;
    2c0f:f248::/32     1;
}

# Host 헤더가 맞지 않는 요청(= IP로 직접 스캔) — 응답 없이 연결을 끊는다.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name api.at-crew.com;

    # Cloudflare를 거치지 않은 직접 접근 차단.
    if ($from_cloudflare = 0) {
        return 444;
    }

    # 앱은 X-Real-IP만 신뢰한다(LoginAttemptLimiter.extractIp()) — 클라이언트가 보낸 값은 여기서
    # 무조건 덮어쓴다. X-Forwarded-For도 이어붙이지 않고 교체해 위조 값이 뒤로 흘러가지 않게 한다.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    # Flexible 모드라 이 구간은 평문이지만 클라이언트가 실제로 사용한 스킴은 https다.
    proxy_set_header X-Forwarded-Proto https;

    # 운영자 전용 내부 엔드포인트 — 재색인은 서버 안에서 localhost:8080으로 직접 호출한다
    # (docs/operations/moderation-block.md). 외부에 열어둘 이유가 없으므로 프록시하지 않는다.
    # 나머지 /internal/*는 외부 발신자가 있어 열어둔다:
    #   /internal/media/*, /internal/artwork/*  — Cloudflare Worker 콜백(X-Internal-Secret 검증)
    #   /internal/billing/stripe/webhook        — Stripe 웹훅(서명 검증)
    location /internal/search/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
