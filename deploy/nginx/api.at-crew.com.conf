# EC2 #1(앱 서버)에 설치. /etc/nginx/sites-available/api.at-crew.com.conf로 복사 후
# /etc/nginx/sites-enabled/에 심볼릭 링크, nginx -t && systemctl reload nginx.
#
# Cloudflare DNS에서 api.at-crew.com A레코드를 이 EC2 탄력적 IP로 연결하고 프록시(오렌지 클라우드) 켤 것.
# SSL/TLS 모드는 Cloudflare 대시보드에서 "Flexible"로 설정 — 클라이언트↔Cloudflare 구간만 HTTPS이고
# Cloudflare↔이 서버 구간은 평문 HTTP라 origin에 인증서가 필요 없다(가장 단순한 구성). 나중에 origin도
# 암호화하고 싶으면 Cloudflare Origin CA 인증서를 발급받아 "Full" 모드로 전환하고 이 파일에 443 서버 블록을
# 추가하면 된다.
server {
    listen 80;
    server_name api.at-crew.com;

    # 외부 업타임 프로브 전용 경로(docs/design/observability-design.md §3.1).
    # actuator는 관리 포트(8081)로 분리돼 서비스 포트에는 없다 — 여기서 liveness 그룹만 골라 공개한다.
    # 응답은 상태 문자열뿐이고(show-details: never), 액세스 로그는 끈다(1분 주기 200 로그가 Loki
    # 무료 한도를 갉아먹는다).
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8081/actuator/health/liveness;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
