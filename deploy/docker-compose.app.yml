# EC2 #1(앱 서버) 전용 — 앱·MariaDB·Elasticsearch를 같이 띄운다(self-hosted, laiteu와 동일 패턴).
# docs/design/mariadb-migration-design.md §10-1, 이슈 #76(EC2 #2 통합) 참고.
services:
  mariadb:
    image: mariadb:11.4
    restart: always
    environment:
      MARIADB_DATABASE: atcrew
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    # 로그 로테이션(docs/design/observability-design.md §4) — docker 기본 json-file 드라이버는 무제한이라
    # 장기 가동 시 로그만으로 디스크가 찬다. 컨테이너당 최대 150MB로 묶는다.
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    # 외부에 포트를 노출하지 않는다 — app 컨테이너가 같은 docker 네트워크에서 서비스명(mariadb)으로 접근.
    healthcheck:
      # depends_on만으로는 컨테이너 "시작"만 기다리고 MariaDB가 실제 접속 가능한 시점은 안 기다린다 —
      # 첫 배포 때 app이 초기화 중인 MariaDB에 Connection refused로 붙었다가 죽는 걸 실제로 겪고 추가함.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20

  # 이슈 #76 — 원래 EC2 #2 전용이던 검색 컨테이너를 여기로 통합. 앱 JVM·MariaDB와 한 인스턴스
  # 메모리를 나눠 쓰므로 힙을 절반(1g→512m)으로 줄였다. 프라이빗 IP로 원격 접근할 필요가 없어져
  # 포트도 호스트에 노출하지 않는다 — 같은 compose 네트워크 안에서 서비스명(elasticsearch)으로만 접근.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    restart: always
    environment:
      discovery.type: single-node
      # TODO: xpack.security는 현재 비활성 — 네트워크 격리(포트 미노출)로 1차 방어 중.
      # 실사용자 트래픽 전이면 인증 활성화 재검토(로컬 dev도 동일하게 비활성, docker-compose.yml 참고).
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: UTC
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  app:
    image: ${APP_IMAGE}
    restart: always
    env_file:
      - .env
    environment:
      # .env의 MARIADB_HOST/PORT(로컬 기본값 localhost:3306)를 컨테이너 네트워크 기준으로 덮어쓴다.
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      # .env의 값은 호스트(EC2) 파일 경로다 — 컨테이너 안에서는 안 보이므로 아래 볼륨으로 마운트한
      # 컨테이너 내부 경로로 덮어쓴다(실제 배포 중 FileNotFoundException으로 발견).
      FIREBASE_CREDENTIALS_PATH: /app/firebase-credentials.json
    volumes:
      # deploy/ 디렉토리에 firebase-credentials.json이라는 이름으로 올려둔 파일을 그대로 마운트한다.
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    ports:
      # nginx(호스트에 직접 설치)만 접근하면 되므로 루프백에만 바인딩 — 8080을 외부에 직접 노출하지 않는다.
      - "127.0.0.1:8080:8080"
      # 관리 포트(actuator) — 호스트의 Alloy 스크레이프와 nginx의 /healthz 프록시만 접근한다.
      # 컨테이너 안에서는 0.0.0.0에 바인딩해야 하고(그래야 포트 매핑이 닿는다), 외부 차단은 이 루프백
      # 바인딩이 담당한다(docs/design/observability-design.md §3.1).
      - "127.0.0.1:8081:8081"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    depends_on:
      mariadb:
        condition: service_healthy
      elasticsearch:
        condition: service_started

volumes:
  mariadb_data:
  elasticsearch_data:
