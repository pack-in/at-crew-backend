# EC2 #1(앱 서버) 전용 — 앱·MariaDB·Elasticsearch를 같이 띄운다(self-hosted, laiteu와 동일 패턴).
# docs/design/mariadb-migration-design.md §10-1, 이슈 #76(EC2 #2 통합) 참고.
services:
  mariadb:
    image: mariadb:11.4
    restart: always
    environment:
      MARIADB_DATABASE: atcrew
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: UTC
    # PA-07(docs/design/infra-security-hardening-design.md D6/D7) — 반동기(semi-sync) Replica의
    # Primary 쪽 설정. server-id/log-bin은 복제 자체에 필요, semisync는 Replica가 커밋을 실제로
    # 받았다는 응답을 기다린 뒤 커밋을 완료해 장애 시 데이터 유실 창을 좁힌다(완전 동기는 아니다 —
    # 타임아웃 지나면 비동기로 자동 전환되어 Primary 가용성은 유지된다).
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=1
      --log-bin=mariadb-bin
      --binlog-format=ROW
      --plugin-load-add=semisync_master.so
      --rpl-semi-sync-master-enabled=1
      --rpl-semi-sync-master-timeout=1000
    volumes:
      - mariadb_data:/var/lib/mysql
      # 슬로우 쿼리 로그(이슈 #118). MariaDB가 conf.d/*.cnf를 자동으로 읽는다 — command 인자에
      # 섞지 않고 파일로 두어 설정마다 이유를 주석으로 남긴다.
      - ./mariadb/slow-query.cnf:/etc/mysql/conf.d/slow-query.cnf:ro
    # 메모리 상한(이슈 #116) — 앱·MariaDB·Elasticsearch가 한 인스턴스(3,830MB)를 나눠 쓴다.
    # 스왑 2GB가 완충으로 깔려 있지만(deploy/bootstrap.sh) 상한이 없으면 한 컨테이너의 폭주가 OOM 킬러를 불러 다른 컨테이너를 죽인다.
    # 세 값의 합(3,300MB)이 인스턴스보다 작아야 호스트 몫이 남는다.
    deploy:
      resources:
        limits:
          memory: 600m
    # 로그 로테이션(docs/design/observability-design.md §4) — docker 기본 json-file 드라이버는 무제한이라
    # 장기 가동 시 로그만으로 디스크가 찬다. 컨테이너당 최대 150MB로 묶는다.
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    # D12(2026-09-02) 정정: Replica가 별도 EC2 인스턴스라 도커 내부 네트워크만으로는 복제가 안 된다
    # — 호스트에 3306을 노출해야 한다. 대신 방어는 네트워크 계층(보안그룹의 app SG — db_replica SG에서
    # 오는 트래픽만 허용)으로 옮긴다. 0.0.0.0 바인딩이지만 SG가 실제 소스를 걸러낸다
    # (nginx 80/443과 동일한 이중 방어 원칙).
    ports:
      - "3306:3306"
    healthcheck:
      # depends_on만으로는 컨테이너 "시작"만 기다리고 MariaDB가 실제 접속 가능한 시점은 안 기다린다 —
      # 첫 배포 때 app이 초기화 중인 MariaDB에 Connection refused로 붙었다가 죽는 걸 실제로 겪고 추가함.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20

  # 이슈 #76 — 원래 EC2 #2 전용이던 검색 컨테이너를 여기로 통합. 앱 JVM·MariaDB와 한 인스턴스
  # 메모리를 나눠 쓰므로 힙을 절반(1g→512m)으로 줄였다. 프라이빗 IP로 원격 접근할 필요가 없어져
  # 포트도 호스트에 노출하지 않는다 — 같은 compose 네트워크 안에서 서비스명(elasticsearch)으로만 접근.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    restart: always
    environment:
      discovery.type: single-node
      # TODO: xpack.security는 현재 비활성 — 네트워크 격리(포트 미노출)로 1차 방어 중.
      # 실사용자 트래픽 전이면 인증 활성화 재검토(로컬 dev도 동일하게 비활성, docker-compose.yml 참고).
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: UTC
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    # 힙 512m에 더해 Lucene·스레드 스택·다이렉트 버퍼가 붙는다. 2026-09-02 실측 RSS가
    # 약 950~1,000MB였으므로 1,100m로 잡는다(이슈 #116).
    deploy:
      resources:
        limits:
          memory: 1100m
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  app:
    image: ${APP_IMAGE}
    restart: always
    env_file:
      - .env
    environment:
      # .env의 MARIADB_HOST/PORT(로컬 기본값 localhost:3306)를 컨테이너 네트워크 기준으로 덮어쓴다.
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      # .env의 값은 호스트(EC2) 파일 경로다 — 컨테이너 안에서는 안 보이므로 아래 볼륨으로 마운트한
      # 컨테이너 내부 경로로 덮어쓴다(실제 배포 중 FileNotFoundException으로 발견).
      FIREBASE_CREDENTIALS_PATH: /app/firebase-credentials.json
      # JVM 힙을 명시한다(이슈 #116). Dockerfile의 ENTRYPOINT에 -Xmx가 없어 지금까지는 기본
      # MaxRAMPercentage 25%가 적용됐고, 그 25%의 분모는 **컨테이너 메모리 상한**이다.
      # 아래 limits(1600m)를 거는 순간 힙이 958MB에서 400MB로 조용히 줄어든다 —
      # 상한과 힙은 반드시 함께 정해야 한다. 900m는 상한 전 실효값(958MB)에 맞춘 값이다.
      JAVA_TOOL_OPTIONS: "-Xmx900m"
    volumes:
      # deploy/ 디렉토리에 firebase-credentials.json이라는 이름으로 올려둔 파일을 그대로 마운트한다.
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    # 힙 900m에 메타스페이스·코드캐시·스레드 스택·다이렉트 버퍼가 더해진다. 2026-09-02 실측
    # RSS가 540~651MB(그때 힙 사용량은 230MB)였으므로 힙 밖 오버헤드를 약 400MB로 보고 1600m로 잡는다.
    deploy:
      resources:
        limits:
          memory: 1600m
    ports:
      # nginx(호스트에 직접 설치)만 접근하면 되므로 루프백에만 바인딩 — 8080을 외부에 직접 노출하지 않는다.
      - "127.0.0.1:8080:8080"
      # 관리 포트(actuator) — 호스트의 Alloy 스크레이프와 nginx의 /healthz 프록시만 접근한다.
      # 컨테이너 안에서는 0.0.0.0에 바인딩해야 하고(그래야 포트 매핑이 닿는다), 외부 차단은 이 루프백
      # 바인딩이 담당한다(docs/design/observability-design.md §3.1).
      - "127.0.0.1:8081:8081"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    depends_on:
      mariadb:
        condition: service_healthy
      elasticsearch:
        condition: service_started

volumes:
  mariadb_data:
  elasticsearch_data:
