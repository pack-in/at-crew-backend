services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: atcrew
    volumes:
      - mongodb_data:/data/db

  # 검색 모듈(docs/design/search-module-design.md) — artwork 원본은 mongodb 그대로, 조회 전용 색인만 별도 보관
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false" # 로컬 개발 전용 — prod는 별도 인증/네트워크 정책 적용
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  mongodb_data:
  elasticsearch_data:
