name: SSM probe (temporary)

# 배포 워크플로를 SSM으로 옮기기 전에 러너의 IAM 자격증명이 SSM을 쓸 수 있는지만 확인한다.
# 검증이 끝나면 이 파일은 삭제한다 — PR에는 남기지 않는다.
on:
  push:
    branches: [fix/deploy-ssm-110]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 누구인가
        run: aws sts get-caller-identity

      - name: ssm:DescribeInstanceInformation
        continue-on-error: true
        run: |
          aws ssm describe-instance-information \
            --query 'InstanceInformationList[].[InstanceId,PingStatus]' --output text

      - name: ssm:SendCommand + GetCommandInvocation
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ secrets.APP_INSTANCE_ID }}
        run: |
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["echo probe-ok; id -un"]' \
            --query Command.CommandId --output text)
          echo "CommandId=$CMD"
          for _ in $(seq 1 15); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          echo "Status=$STATUS"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
