name: Deploy

# main push(=PR 머지) 시 자동 배포. deploy/deploy.sh(로컬 수동 스크립트)와 동일한 절차를
# GitHub Actions로 옮긴 것 — 테스트 통과를 배포의 필수 조건으로 묶고, 이미지 태그를 latest 고정 대신
# 커밋 SHA로 바꿔 문제 발생 시 이전 태그로 즉시 롤백할 수 있게 한다.
#
# 필요한 저장소 Secrets(Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN — Docker Hub 로그인/푸시
#   APP_HOST                            — EC2 #1 탄력적 IP (예: <APP_HOST>)
#   EC2_SSH_KEY                         — at-crew-key.pem 파일 내용 그대로
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY — 보안 그룹 22번 임시 개방/회수용
#
# 앱 서버 보안 그룹은 22번을 특정 IP에만 허용한다. 러너 IP는 매 실행마다 바뀌므로 배포 직전에
# 그 IP만 열고 끝나면 반드시 회수한다(회수는 if: always() — 앞 단계가 실패해도 규칙을 남기지 않는다).
#
# TODO(인프라): SSH + 보안그룹 임시 개방 방식을 SSM Session Manager로 대체한다. 22번 포트를 아예
# 닫고 IAM으로 접근을 통제하며 접속 이력이 CloudTrail에 남는 구성이 정석이다. 인스턴스에
# AmazonSSMManagedInstanceCore 역할 부착 + 워크플로에 session-manager-plugin 설치가 선행 조건이며,
# 결제 sandbox 검증이 끝난 뒤 착수한다.
on:
  push:
    branches: [main]

# 짧은 시간에 main push가 겹치면 두 배포가 동시에 EC2 재기동을 시도해 Flyway 마이그레이션 적용
# 순서가 꼬일 수 있다(2026-08-19 실제 발생 — V20이 V17~19보다 먼저 적용돼 검증 실패로 크래시 루프).
# cancel-in-progress: false로 취소가 아니라 대기시켜서, 항상 한 번에 하나씩 순서대로만 배포되게 한다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      AWS_REGION: ap-northeast-2
      # 앱 서버(EC2 #1) 보안 그룹. 비밀은 아니지만 공개 저장소에 계정 리소스 식별자를 굳이 남기지
      # 않는다 — 저장소 Variables(Settings > Secrets and variables > Actions > Variables)에 둔다.
      APP_SECURITY_GROUP_ID: ${{ vars.APP_SECURITY_GROUP_ID }}
      # 알람 억제용. 아직 미등록이면 빈 값이고, 관련 단계는 조용히 건너뛴다(PA-09 전까지 억제할 알람이 없다).
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 배포 실패 시 "이번 배포에 새 Flyway 마이그레이션이 있었는지"를 이전 커밋과의 diff로 판정한다.
          # 기본 fetch-depth: 1이면 비교 대상 커밋이 없어 판정이 불가능하다.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 푸시 (arm64, 커밋 SHA + latest 태그)
        env:
          IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}/at-crew-backend
        # 배포 대상 EC2가 ARM64라 러너(amd64) 기본 빌드 결과를 올리면 컨테이너가 뜨지 못한다
        # (첫 자동 배포에서 "platform does not match"로 실제 발생). 앞 단계의 ./gradlew build가 만든
        # jar를 Dockerfile.ci로 담기만 하므로 에뮬레이션 없이 arm64 이미지를 만들 수 있다.
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile.ci \
            -t "$IMAGE_BASE:${{ github.sha }}" \
            -t "$IMAGE_BASE:latest" \
            --push .

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 보안 그룹에 러너 IP 임시 허용 (22번)
        id: open-ssh
        run: |
          RUNNER_IP=$(curl -s --fail https://checkip.amazonaws.com)
          echo "RUNNER_CIDR=${RUNNER_IP}/32" >> "$GITHUB_ENV"
          # 이전 실행이 비정상 종료돼 규칙이 남아 있으면 중복 오류가 나므로 무시하고 진행한다.
          aws ec2 authorize-security-group-ingress \
            --group-id "$APP_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=github-actions-${{ github.run_id }}}]" \
            || echo "규칙이 이미 존재해 건너뜁니다"

      - name: EC2 SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.APP_HOST }}" >> ~/.ssh/known_hosts

      # 배포가 실패했을 때 되돌아갈 지점 — 지금 서버가 실제로 돌리고 있는 이미지 태그를 먼저 확보한다.
      # 커밋 이력이 아니라 "현재 떠 있는 것"을 기준으로 잡아야, 이전 배포가 실패로 끝났던 경우에도
      # 정상 동작하던 버전으로 돌아간다.
      - name: 현재 실행 중인 이미지 확인
        id: prev
        run: |
          # compose ps는 APP_IMAGE 환경변수가 없으면 프로젝트 파싱에 실패한다(실측). 컨테이너 이름도
          # 디렉토리명에 의존하므로, compose가 붙여주는 라벨로 조회한다.
          PREV=$(ssh -i ~/.ssh/deploy_key "ec2-user@${{ secrets.APP_HOST }}" \
            "docker ps --filter 'label=com.docker.compose.service=app' --format '{{.Image}}' | head -1")
          echo "image=$PREV" >> "$GITHUB_OUTPUT"
          echo "직전 실행 이미지: ${PREV:-(없음)}"

      # 배포 중에는 재시작으로 인한 짧은 다운이 정상이다 — 그걸 매번 P1으로 울리면 두 주 안에 알람을
      # 무시하게 된다(docs/design/observability-design.md §7.3). 알람 구축(PA-09) 전에는 억제할 알람이
      # 없으므로 시크릿이 없으면 조용히 건너뛴다.
      - name: 알람 억제(silence) 생성
        id: silence
        continue-on-error: true
        if: env.GRAFANA_URL != '' && env.GRAFANA_API_KEY != ''
        run: |
          STARTS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ENDS=$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:%SZ)
          ID=$(curl -sS -X POST "$GRAFANA_URL/api/alertmanager/grafana/api/v2/silences" \
            -H "Authorization: Bearer $GRAFANA_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"matchers\":[{\"name\":\"alertname\",\"value\":\".*\",\"isRegex\":true}],
                 \"startsAt\":\"$STARTS\",\"endsAt\":\"$ENDS\",
                 \"createdBy\":\"github-actions\",\"comment\":\"deploy ${{ github.sha }}\"}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("silenceID",""))' || true)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: EC2 재기동 (deploy.sh 2/3 단계와 동일 절차)
        env:
          IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}/at-crew-backend
        run: |
          ssh -i ~/.ssh/deploy_key "ec2-user@${{ secrets.APP_HOST }}" "cd ~/at-crew-backend/deploy && \
            APP_IMAGE=$IMAGE_BASE:${{ github.sha }} docker-compose -f docker-compose.app.yml pull app && \
            APP_IMAGE=$IMAGE_BASE:${{ github.sha }} docker-compose -f docker-compose.app.yml up -d"

      # 재기동 명령이 성공했다는 것과 앱이 실제로 뜬 것은 다르다 — 2026-08-19에는 Flyway 적용 순서가
      # 꼬여 크래시 루프에 빠졌는데도 배포는 초록으로 끝났다. liveness가 UP이 될 때까지 최대 3분 기다린다.
      - name: 헬스체크 대기 (최대 3분)
        id: health
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key "ec2-user@${{ secrets.APP_HOST }}" '
            for i in $(seq 1 36); do
              if curl -fsS --max-time 5 http://127.0.0.1:8081/actuator/health/liveness | grep -q UP; then
                echo "liveness UP ($((i*5))초)"; exit 0
              fi
              sleep 5
            done
            echo "3분 내 liveness UP 실패 — 최근 로그:"
            cd ~/at-crew-backend/deploy && docker-compose -f docker-compose.app.yml logs --tail=50 app
            exit 1'

      # 스키마는 롤백되지 않는다. 새 마이그레이션이 적용된 뒤 구버전 앱으로 되돌리면 ddl-auto: validate가
      # 실패해 또 죽는다 — 이 경우엔 자동 롤백 대신 사람을 부른다(설계 D13).
      - name: 이번 배포의 마이그레이션 포함 여부 판정
        id: mig
        if: steps.health.outcome == 'failure'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "비교 기준 커밋을 찾을 수 없어 마이그레이션이 있다고 간주한다(안전측)"
            echo "has=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" \
            -- src/main/resources/db/migration || true)
          if [ -n "$CHANGED" ]; then
            echo "새 마이그레이션 발견:"; echo "$CHANGED"
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "새 마이그레이션 없음 — 자동 롤백 가능"
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 직전 이미지로 롤백
        id: rollback
        if: steps.health.outcome == 'failure' && steps.mig.outputs.has == 'false' && steps.prev.outputs.image != ''
        run: |
          PREV="${{ steps.prev.outputs.image }}"
          echo "롤백 대상: $PREV"
          # 배포 후 prune으로 이전 이미지가 서버에 남아 있지 않으므로 레지스트리에서 다시 받는다.
          ssh -i ~/.ssh/deploy_key "ec2-user@${{ secrets.APP_HOST }}" "cd ~/at-crew-backend/deploy && \
            APP_IMAGE=$PREV docker-compose -f docker-compose.app.yml pull app && \
            APP_IMAGE=$PREV docker-compose -f docker-compose.app.yml up -d"
          ssh -i ~/.ssh/deploy_key "ec2-user@${{ secrets.APP_HOST }}" '
            for i in $(seq 1 36); do
              curl -fsS --max-time 5 http://127.0.0.1:8081/actuator/health/liveness | grep -q UP && exit 0
              sleep 5
            done
            echo "롤백 후에도 liveness가 올라오지 않는다"; exit 1'

      # 배포마다 새 SHA 태그 이미지(약 500MB)가 쌓이는데 지우는 단계가 없어 루트 볼륨 8GB 중 74%가
      # 찼었다(2026-08-24 점검, 정리로 43%까지 회수). 실행 중인 컨테이너가 쓰는 이미지는 prune 대상이
      # 아니므로 현재 배포본과 mariadb만 남는다.
      - name: 사용하지 않는 이미지 정리
        if: always() && env.RUNNER_CIDR != ''
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key "ec2-user@${{ secrets.APP_HOST }}" "docker image prune -af"

      - name: 알람 억제 해제
        if: always() && steps.silence.outputs.id != ''
        continue-on-error: true
        run: |
          curl -sS -X DELETE "$GRAFANA_URL/api/alertmanager/grafana/api/v2/silence/${{ steps.silence.outputs.id }}" \
            -H "Authorization: Bearer $GRAFANA_API_KEY" || true

      - name: 보안 그룹에서 러너 IP 회수
        # 앞 단계가 실패해도 반드시 돌려놓는다 — 실패한 배포가 22번을 열어둔 채 끝나면 안 된다.
        if: always() && env.RUNNER_CIDR != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$APP_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR" \
            || echo "회수할 규칙이 없습니다"

      # 성공·롤백·실패 세 경우 모두 알린다. 롤백과 실패는 P1(즉시 확인), 성공은 P2(기록용)로 보낸다
      # — 이 통지는 위 silence와 무관한 별도 경로라 배포 억제 중에도 항상 도착한다.
      - name: Discord 통지
        if: always()
        continue-on-error: true
        env:
          WEBHOOK_P1: ${{ secrets.DISCORD_WEBHOOK_P1 }}
          WEBHOOK_P2: ${{ secrets.DISCORD_WEBHOOK_P2 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ steps.health.outcome }}" = "success" ]; then
            HOOK="$WEBHOOK_P2"
            MSG="**배포 성공** \`$SHA_SHORT\` by ${{ github.actor }}\n$RUN_URL"
          elif [ "${{ steps.rollback.outcome }}" = "success" ]; then
            HOOK="$WEBHOOK_P1"
            MSG="**배포 실패 → 자동 롤백 완료** \`$SHA_SHORT\`\n직전 이미지로 되돌렸고 liveness는 UP이다. 원인 확인 필요.\n$RUN_URL"
          elif [ "${{ steps.mig.outputs.has }}" = "true" ]; then
            HOOK="$WEBHOOK_P1"
            MSG="**배포 실패 — 자동 롤백 안 함(마이그레이션 포함)** \`$SHA_SHORT\`\n스키마가 전진해 구버전 앱은 validate에서 죽는다. 수동 대응 필요: docs/operations/incident-runbook.md\n$RUN_URL"
          else
            HOOK="$WEBHOOK_P1"
            MSG="**배포 실패 — 롤백도 실패** \`$SHA_SHORT\`\n서비스가 내려가 있을 수 있다. 즉시 확인 필요.\n$RUN_URL"
          fi
          [ -n "$HOOK" ] || { echo "웹훅 미설정 — 통지 생략"; exit 0; }
          curl -sS -X POST "$HOOK" -H 'Content-Type: application/json' \
            -d "$(python3 -c 'import json,os,sys; print(json.dumps({"username":"at-crew deploy","content":sys.argv[1]}))' "$(printf '%b' "$MSG")")"

      # 헬스체크가 실패했으면 롤백 성공 여부와 무관하게 워크플로는 실패로 남긴다 — 초록으로 끝나면
      # 아무도 다시 보지 않는다.
      - name: 배포 결과 확정
        if: steps.health.outcome == 'failure'
        run: |
          echo "헬스체크 실패. 롤백: ${{ steps.rollback.outcome }}, 마이그레이션 포함: ${{ steps.mig.outputs.has }}"
          exit 1
