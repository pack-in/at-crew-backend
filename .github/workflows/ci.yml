name: CI

on:
  pull_request:
    # dev를 통합 브랜치로 쓰므로 dev 대상 PR도 검증한다 — main 머지는 곧 prod 배포라
    # 그 전에 dev에서 한 번 걸러낸다.
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            perf
          requireScope: false

  # 이미 적용된 마이그레이션은 주석 한 줄도 고치면 안 된다 — Flyway가 적용 시점의 체크섬을 검사하므로
  # 운영 DB에서 기동이 거부된다. 테스트·CI는 매번 빈 DB에서 전체를 새로 적용해 이 불일치가 드러나지 않는다.
  # 2026-09-23에 V41의 주석 한 줄을 고쳐 운영이 6분간 중단됐다.
  guard-applied-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # 기준 브랜치와 비교해야 하므로 전체 이력을 받는다.
          fetch-depth: 0

      - name: 적용된 마이그레이션 변경 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # main에 이미 있는 마이그레이션 파일이 이 PR에서 수정·삭제·이름변경됐는지 본다.
          # 새 파일 추가(A)는 정상이므로 제외한다.
          git fetch --no-tags --depth=1 origin main
          changed=$(git diff --name-status --diff-filter=MDR "$BASE_SHA" HEAD -- src/main/resources/db/migration/ || true)
          applied=""
          while read -r status path rest; do
            [ -z "${path:-}" ] && continue
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              applied="$applied$status $path\n"
            fi
          done <<< "$changed"
          if [ -n "$applied" ]; then
            echo "::error::이미 배포된 마이그레이션 파일을 고쳤다. Flyway 체크섬이 어긋나 운영 기동이 거부된다."
            printf "%b" "$applied"
            echo "고칠 내용이 있으면 새 마이그레이션 파일을 추가한다."
            exit 1
          fi
          echo "적용된 마이그레이션 변경 없음"

  build-and-test:
    runs-on: ubuntu-latest
    # 공개 레포에서는 fork가 연 PR도 이 잡을 돌린다 — PR 브랜치의 build.gradle이 곧 러너에서 실행되는
    # 코드이므로 토큰 권한을 읽기로 못박는다(pull_request 트리거라 저장소 Secrets는 애초에 주입되지 않는다).
    permissions:
      contents: read
    # 글로벌 시간대 전략(docs/design/global-timezone-strategy.md §3.1) — 빌드/테스트 환경 시간대를 UTC로 명시 고정
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      # setup-java의 gradle 캐시는 빌드 파일 해시로만 키를 잡아 build.gradle을 한 줄만 고쳐도
      # 200MB를 통째로 다시 받는다. setup-gradle은 restore-keys로 부분 복원하고 Gradle 빌드 캐시
      # (~/.gradle/caches/build-cache-1)까지 함께 보관해, 입력이 안 바뀐 태스크는 아예 건너뛴다.
      # 캐시 쓰기는 기본 브랜치 잡에서만 일어나고 나머지는 읽기 전용이라 서로 오염되지 않는다.
      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 및 테스트
        run: ./gradlew build

      # 실패한 실행의 원인을 나중에 다시 볼 수 있게 남긴다. 콘솔 출력은 잘리는 데다
      # 워크플로 로그는 보존 기간이 지나면 사라진다 — 간헐적 실패는 여러 번의 리포트를
      # 나란히 놓고 비교해야 패턴이 보인다.
      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 14
