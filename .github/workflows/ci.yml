name: CI

on:
  pull_request:
    # dev를 통합 브랜치로 쓰므로 dev 대상 PR도 검증한다 — main 머지는 곧 prod 배포라
    # 그 전에 dev에서 한 번 걸러낸다.
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            perf
          requireScope: false

  build-and-test:
    runs-on: ubuntu-latest
    # 공개 레포에서는 fork가 연 PR도 이 잡을 돌린다 — PR 브랜치의 build.gradle이 곧 러너에서 실행되는
    # 코드이므로 토큰 권한을 읽기로 못박는다(pull_request 트리거라 저장소 Secrets는 애초에 주입되지 않는다).
    permissions:
      contents: read
    # 글로벌 시간대 전략(docs/design/global-timezone-strategy.md §3.1) — 빌드/테스트 환경 시간대를 UTC로 명시 고정
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      # setup-java의 gradle 캐시는 빌드 파일 해시로만 키를 잡아 build.gradle을 한 줄만 고쳐도
      # 200MB를 통째로 다시 받는다. setup-gradle은 restore-keys로 부분 복원하고 Gradle 빌드 캐시
      # (~/.gradle/caches/build-cache-1)까지 함께 보관해, 입력이 안 바뀐 태스크는 아예 건너뛴다.
      # 캐시 쓰기는 기본 브랜치 잡에서만 일어나고 나머지는 읽기 전용이라 서로 오염되지 않는다.
      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 및 테스트
        run: ./gradlew build

      # 실패한 실행의 원인을 나중에 다시 볼 수 있게 남긴다. 콘솔 출력은 잘리는 데다
      # 워크플로 로그는 보존 기간이 지나면 사라진다 — 간헐적 실패는 여러 번의 리포트를
      # 나란히 놓고 비교해야 패턴이 보인다.
      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 14
