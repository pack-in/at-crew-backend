name: CI

on:
  pull_request:
    # dev를 통합 브랜치로 쓰므로 dev 대상 PR도 검증한다 — main 머지는 곧 prod 배포라
    # 그 전에 dev에서 한 번 걸러낸다.
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            perf
          requireScope: false

  build-and-test:
    runs-on: ubuntu-latest
    # 글로벌 시간대 전략(docs/design/global-timezone-strategy.md §3.1) — 빌드/테스트 환경 시간대를 UTC로 명시 고정
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: 빌드 및 테스트
        run: ./gradlew build
