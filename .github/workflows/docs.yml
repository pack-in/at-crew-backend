name: Publish API Docs

# main push마다 OpenAPI 스펙을 떠서 정적 Swagger UI 사이트로 Cloudflare Pages에 배포한다.
# prod는 보안상 springdoc이 꺼져 있으므로(application-prod.yml) 실서버가 문서 소스가 될 수 없다 —
# OpenApiExportTest가 유일한 소스. 정적 산출물만 배포하므로 EC2 접근이 필요 없고, deploy.yml과
# 무관하게 독립적으로 동작한다.
#
# GitHub Pages 대신 Cloudflare Pages를 쓰는 이유: pack-in 조직이 GitHub Free 플랜이라 private
# 저장소의 GitHub Pages를 쓸 수 없다(Pro/Team 이상 필요, 2026-08-19 확인). Cloudflare는 이미 DNS·R2로
# 쓰고 있어 별도 벤더 계정이 필요 없고 private 저장소 제약도 없다.
#
# 필요한 저장소 Secrets(Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   — "Cloudflare Pages: Edit" 권한 포함 토큰
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 대시보드 우측 하단에서 확인 가능
# cloudflare/pages-action@v1과 plain "wrangler pages deploy" 둘 다 프로젝트가 미리 존재해야 하고
# 자동 생성하지 않는다(2026-08-19, 두 방식 모두 "Project not found"로 실패해 직접 확인) — "project create"를
# 먼저 실행해 프로젝트를 만든다. 이미 있으면 실패하므로 continue-on-error로 무시하고 다음 배포 단계로 넘어간다.
on:
  push:
    branches: [main]
  workflow_dispatch: # Secrets 등록 직후 수동 실행으로 즉시 검증하기 위함

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      # setup-java의 gradle 캐시는 빌드 파일 해시로만 키를 잡아 build.gradle을 한 줄만 고쳐도
      # 200MB를 통째로 다시 받는다. setup-gradle은 restore-keys로 부분 복원하고 Gradle 빌드 캐시
      # (~/.gradle/caches/build-cache-1)까지 함께 보관해, 입력이 안 바뀐 태스크는 아예 건너뛴다.
      # 캐시 쓰기는 기본 브랜치 잡에서만 일어나고 나머지는 읽기 전용이라 서로 오염되지 않는다.
      - uses: gradle/actions/setup-gradle@v4

      - name: OpenAPI 스펙 추출 (build/openapi/openapi.json)
        run: ./gradlew test --tests "com.atcrew.support.OpenApiExportTest"

      - name: 정적 사이트 조립
        run: |
          mkdir -p site
          cp docs/api-site/index.html site/index.html
          cp build/openapi/openapi.json site/openapi.json

      - name: Cloudflare Pages 프로젝트 생성 (없을 때만 — 있으면 실패해도 무시)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create at-crew-api-docs --production-branch=main

      - name: Cloudflare Pages 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=at-crew-api-docs --branch=main
