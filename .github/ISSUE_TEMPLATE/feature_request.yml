name: 기능 요청
description: 새로운 기능 또는 개선 사항을 제안합니다
title: "feat: "
labels: ["feat", "needs-triage"]
body:
  - type: textarea
    id: context
    attributes:
      label: 배경 및 문제
      description: 이 기능이 필요한 이유, 현재 어떤 불편함이 있는지 설명해주세요
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
      description: 어떤 기능이 추가되었으면 하는지 구체적으로 설명해주세요
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 접근 방법도 고려해보셨나요? (선택)
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 관련 모듈 (scope)
      options:
        - auth
        - user
        - portfolio
        - 기타
    validations:
      required: false
