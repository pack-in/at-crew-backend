name: 버그 리포트
description: 예상과 다르게 동작하는 버그를 제보합니다
title: "fix: "
labels: ["fix", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 버그인지 명확하게 설명해주세요
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 에러 메시지, 스택 트레이스, 스크린샷 등을 첨부하면 좋습니다
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 관련 모듈 (scope)
      options:
        - auth
        - user
        - portfolio
        - 기타
    validations:
      required: false
