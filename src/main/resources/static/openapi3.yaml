              $ref: "#/components/schemas/api-auth-email-login-33084672"
            examples:
              bookmark/save-already-exists:
                value: |-
                  {
                    "artworkId" : "019ff50b-31e6-77e6-b6a4-7441285d5105"
                  }
      responses:
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-auth-email-login-33084672"
              examples:
                bookmark/save-already-exists:
