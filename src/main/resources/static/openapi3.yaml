      operationId: artwork/upload-invalid-representative-index
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-auth-email-login-33084672"
            examples:
              artwork/upload-invalid-representative-index:
                value: |-
                  {
                    "imageKeys" : [ "raw/79419512-5877-4256-9513-5a22440be523.png" ],
                    "representativeImageIndex" : 5,
                    "imageLayoutType" : "VERTICAL_SCROLL",
                    "title" : "테스트 작품",
                    "artworkField" : "ILLUSTRATION",
                    "creativeType" : "ORIGINAL",
                    "roles" : [ "LINEART" ],
                    "ageRating" : "ALL",
                    "visibility" : "PUBLIC"
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-auth-email-login-33084672"
              examples:
                artwork/upload-invalid-representative-index:
                  value: |-
                    {
                      "code" : "INVALID_REPRESENTATIVE_INDEX",
                      "message" : "대표 이미지 인덱스가 유효하지 않습니다"
                    }
