      tags:
      - api
      summary: 이미 북마크한 작품을 다시 저장 시도 — 409 BOOKMARK_ALREADY_EXISTS
      description: 이미 북마크한 작품을 다시 저장 시도 — 409 BOOKMARK_ALREADY_EXISTS
      operationId: bookmark/save-already-exists
      requestBody:
