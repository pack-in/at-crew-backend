      - api
      summary: 이미 기업 프로필을 보유한 회원이 재생성 시도 — 409 COMPANY_ALREADY_EXISTS
      description: 이미 기업 프로필을 보유한 회원이 재생성 시도 — 409 COMPANY_ALREADY_EXISTS
