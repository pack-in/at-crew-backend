        description: ""
        required: true
        schema:
          type: string
      responses:
        "410":
          description: "410"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-auth-email-login-33084672"
              examples:
                artwork/get-deleted:
                  value: |-
