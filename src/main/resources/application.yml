spring:
  application:
    name: at-crew-backend
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  # MariaDB 전환(docs/design/mariadb-migration-design.md) — prod 접속 정보는 P6에서 채움
  datasource:
    url: jdbc:mariadb://${MARIADB_HOST:localhost}:${MARIADB_PORT:3306}/${MARIADB_DATABASE:atcrew}?connectionTimeZone=UTC
    username: ${MARIADB_USERNAME:root}
    password: ${MARIADB_PASSWORD:atcrew_local_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  # Modulith 이벤트 레지스트리(docs/design/mariadb-migration-design.md §3.8) —
  # event_publication 스키마의 유일한 진실은 Flyway(V13)이므로 Modulith 자동 생성은 끈다.
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-},%X{memberId:-}]"
    # 글로벌 시간대 전략(docs/design/global-timezone-strategy.md §3.4) — 로그 타임스탬프를 UTC로 명시 고정.
    # JVM 기본 시간대(§3.1)와 무관하게 항상 UTC로 렌더링하고, 오프셋(XXX)이 "Z"로 표기되어 관측 도구에서
    # 리전과 무관한 단일 기준으로 상관관계 분석이 가능하다.
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC"

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: http://localhost:3000

jwt:
  secret: ${JWT_SECRET:at-crew-default-secret-key-for-dev-only-must-be-at-least-64-chars-long}
  access-token-expiration: 3600000       # 1시간 (ms)
  refresh-token-expiration: 2592000000   # 30일 (ms)

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT:https://dummy.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:dummy-access-key}
    secret-key: ${R2_SECRET_KEY:dummy-secret-key}
    bucket: ${R2_BUCKET:at-crew-storage}
    presign-expiration-minutes: 10
    worker-trigger-url: ${WORKER_TRIGGER_URL:http://localhost:8080/internal/artwork/images/processed}
    callback-secret: ${WORKER_CALLBACK_SECRET:dev-internal-secret}

artwork:
  internal:
    secret: ${ARTWORK_INTERNAL_SECRET:dev-internal-secret}

search:
  internal:
    secret: ${SEARCH_INTERNAL_SECRET:dev-internal-secret}
