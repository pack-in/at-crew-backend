spring.modulith:
  events:
    # 미완료 이벤트 재발행 — 기동 시 event_publication의 completion_date가 비어 있는 행을 다시 발행한다
    republish-outstanding-events-on-restart: true

springdoc:
  # SecurityConfig에서 /swagger-ui/**, /v3/api-docs/**가 permitAll이라 prod에서는 여기서 완전히 꺼야 한다
  # (사용자 결정, 2026-08-07 — docs/NEXT_STEPS.md 참고).
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

app:
  frontend-base-url: ${FRONTEND_BASE_URL}

mail:
  resend:
    api-key: ${RESEND_API_KEY}
    from-address: ${MAIL_FROM_ADDRESS}

# application.yml의 dummy/dev 기본값이 prod에서 조용히 쓰이는 걸 막는다 — 값이 비어 있으면
# 기동 자체가 실패해야 한다(jwt.secret/cors.allowed-origins/firebase.credentials-path와 동일 원칙,
# 2026-08-12 — 이전까지는 이 4개만 fail-fast가 없어 값 누락 시 "dev-internal-secret"/"dummy-*"로
# 조용히 뜰 수 있었다).
cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    worker-trigger-url: ${WORKER_TRIGGER_URL}
    callback-secret: ${WORKER_CALLBACK_SECRET}

artwork:
  internal:
    secret: ${ARTWORK_INTERNAL_SECRET}

search:
  internal:
    secret: ${SEARCH_INTERNAL_SECRET}

# billing 모듈(2026-08-18 merge)이 위 fail-fast 원칙 적용 전에 들어와 stripe.*가 application.yml의
# 빈 문자열 기본값으로 조용히 기동될 수 있었다(2026-08-19 점검에서 발견) — 값이 없으면 결제 API를
# 처음 호출하는 시점에야 실패했다. 다른 필수값과 동일하게 기동 시점 fail-fast로 맞춘다.
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

logging:
  level:
    root: WARN          # 프레임워크 노이즈 차단
    com.atcrew: INFO    # 비즈니스 이벤트(로그인·가입·탈퇴) + WARN·ERROR
