spring:
  autoconfigure:
    exclude:
      # 로컬 standalone MongoDB는 트랜잭션 미지원 — replica set 없이도 구동
      - org.springframework.modulith.events.mongodb.MongoDbTransactionAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.atcrew: DEBUG
    # MongoDB 쿼리 디버깅
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    # Spring Security 인증 흐름 디버깅
    org.springframework.security: DEBUG
