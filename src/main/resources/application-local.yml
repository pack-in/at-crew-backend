management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  endpoint:
    health:
      show-details: always

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.atcrew: DEBUG
    # MongoDB 쿼리 디버깅
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    # Spring Security 인증 흐름 디버깅
    org.springframework.security: DEBUG
