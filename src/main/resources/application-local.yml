management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  endpoint:
    health:
      show-details: always

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.atcrew: DEBUG
    # Spring Security 인증 흐름 디버깅
    org.springframework.security: DEBUG

# 로컬 개발 전용 값. application.yml에는 기본값을 두지 않는다 — 레포가 공개되어 있어 거기 적힌 값은
# 곧 공개된 시크릿이 되고, 값 주입을 빠뜨린 배포 환경이 그 값으로 조용히 기동할 수 있기 때문이다.
# 이 파일의 값은 local 프로파일에서만 쓰이며 외부에 노출되는 환경에서는 절대 쓰지 않는다.
jwt:
  secret: ${JWT_SECRET:local-only-jwt-secret-not-for-any-deployed-environment-64bytes-min}

cloudflare:
  r2:
    callback-secret: ${WORKER_CALLBACK_SECRET:local-only-internal-secret}

artwork:
  internal:
    secret: ${ARTWORK_INTERNAL_SECRET:local-only-internal-secret}

search:
  internal:
    secret: ${SEARCH_INTERNAL_SECRET:local-only-internal-secret}
