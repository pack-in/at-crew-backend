spring:
  autoconfigure:
    exclude:
      # JPA(HibernateJpaConfiguration)의 transactionManager 빈과 이름이 충돌 — application.yml(main)과 동일하게 제외
      - org.springframework.modulith.events.mongodb.MongoDbTransactionAutoConfiguration
  data:
    mongodb:
      auto-index-creation: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

jwt:
  secret: test-secret-key-for-unit-tests-only-must-be-at-least-64-bytes-long-here
  access-token-expiration: 3600000
  refresh-token-expiration: 2592000000

cloudflare:
  r2:
    endpoint: https://test.r2.cloudflarestorage.com
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: test-bucket
    presign-expiration-minutes: 10
    worker-trigger-url: http://localhost:8080/internal/artwork/images/processed
    callback-secret: test-internal-secret

artwork:
  internal:
    secret: test-internal-secret
