spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  # Modulith 이벤트 레지스트리(docs/design/mariadb-migration-design.md §3.8) —
  # 이 파일이 test classpath에서 main application.yml을 완전히 대체하므로 별도로 명시해야 한다.
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

jwt:
  secret: test-secret-key-for-unit-tests-only-must-be-at-least-64-bytes-long-here
  access-token-expiration: 3600000
  refresh-token-expiration: 2592000000

cloudflare:
  r2:
    endpoint: https://test.r2.cloudflarestorage.com
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: test-bucket
    presign-expiration-minutes: 10
    worker-trigger-url: http://localhost:8080/internal/artwork/images/processed
    callback-secret: test-internal-secret

artwork:
  internal:
    secret: test-internal-secret

search:
  internal:
    secret: test-internal-secret

# 결제/구독(plans/260813-stripe-billing) — 이 파일이 main application.yml을 완전히 대체하므로
# 상품 카탈로그를 여기에도 둔다. 없으면 요금제 API가 "상품 설정이 없습니다"로 500을 낸다.
# 실제 Stripe 호출은 테스트에서 하지 않으므로 키는 비워 두고, Price ID만 판별 가능한 더미 값을 쓴다.
stripe:
  secret-key: ""
  publishable-key: ""
  webhook-secret: ""

billing:
  frontend-base-url: http://localhost:3000
  products:
    pro-monthly:
      price-id: price_test_pro_monthly
      amount: 599
      list-amount: 1199
    pro-yearly:
      price-id: price_test_pro_yearly
      amount: 5999
      list-amount: 11999
    team-posting:
      price-id: price_test_team_posting
      amount: 3999
    boost:
      price-id: price_test_boost
      amount: 799
    job-posting:
      price-id: price_test_job_posting
      amount: 9999
