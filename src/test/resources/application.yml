spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  # Modulith 이벤트 레지스트리(docs/design/mariadb-migration-design.md §3.8) —
  # 이 파일이 test classpath에서 main application.yml을 완전히 대체하므로 별도로 명시해야 한다.
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

jwt:
  secret: test-secret-key-for-unit-tests-only-must-be-at-least-64-bytes-long-here
  access-token-expiration: 3600000
  refresh-token-expiration: 2592000000

cloudflare:
  r2:
    endpoint: https://test.r2.cloudflarestorage.com
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: test-bucket
    presign-expiration-minutes: 10
    worker-trigger-url: http://localhost:8080/internal/artwork/images/processed
    callback-secret: test-internal-secret

artwork:
  internal:
    secret: test-internal-secret

search:
  internal:
    secret: test-internal-secret

app:
  frontend-base-url: https://at-crew.com

mail:
  resend:
    api-key: test-resend-key
    from-address: AT-CREW <test@at-crew.com>

# 결제/구독(plans/260813-stripe-billing) — 이 파일이 main application.yml을 완전히 대체하므로
# 상품 카탈로그를 여기에도 둔다. 없으면 요금제 API가 "상품 설정이 없습니다"로 500을 낸다.
# 실제 Stripe 호출은 테스트에서 하지 않으므로 키는 비워 두고, Price ID만 판별 가능한 더미 값을 쓴다.
stripe:
  secret-key: ""
  publishable-key: ""
  webhook-secret: ""

billing:
  frontend-base-url: http://localhost:3000
  # MVP 단일 요금제(PH-08) + 연간 결제 재개(PH-09) — main application.yml과 동일.
  products:
    pro-monthly:
      price-id: price_test_pro_monthly
      amount: 800
      list-amount:
      enabled: true
    pro-yearly:
      price-id: price_test_pro_yearly
      amount: 8000
      list-amount: 9600
      enabled: true
    team-posting:
      price-id: price_test_team_posting
      amount: 3999
      list-amount:
      enabled: false
    boost:
      price-id: price_test_boost
      amount: 799
      list-amount:
      enabled: false
    job-posting:
      price-id: price_test_job_posting
      amount: 9999
      list-amount:
      enabled: false

# 이슈 #62 회귀 방지 — Sentry 초기화는 DSN이 있을 때만 도는 코드라, 여기에 DSN이 없으면
# 그 경로가 한 번도 테스트되지 않는다(실제로 그래서 Spring Boot 4 비호환을 CI가 못 잡았다).
# 더미 DSN을 두어 모든 통합 테스트가 초기화 경로를 함께 밟게 한다.
# 형식만 유효한 값이라 전송은 백그라운드에서 조용히 실패하고 테스트 결과에 영향을 주지 않는다.
#
# 주의: 이 값을 개별 테스트의 @SpringBootTest(properties=...)로 옮기지 말 것 — 속성이 다르면
# 컨텍스트가 하나 더 생기고, 그 컨텍스트가 닫힐 때 SharedContainersConfig의 공유 컨테이너가
# 함께 종료돼 다른 테스트가 연쇄로 깨진다(2026-08-27 실측).
sentry:
  dsn: https://publickey@localhost/1
  environment: test
  send-default-pii: false
  traces-sample-rate: 0.0
  max-breadcrumbs: 20
  context-tags:
    - requestId
    - memberId
  logging:
    # 테스트에서는 이벤트를 만들지 않는다(off). 초기화 경로는 dsn이 있으면 그대로 도므로
    # 이슈 #62 회귀 방지 목적은 유지되고, ERROR 로그마다 localhost로 전송을 시도하며
    # 전송 스레드와 실패한 연결을 쌓는 낭비만 사라진다 — 테스트가 외부로 나가서도 안 된다.
    minimum-event-level: off
    minimum-breadcrumb-level: off
